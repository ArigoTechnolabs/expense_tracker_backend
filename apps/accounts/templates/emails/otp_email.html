<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f4f4f4; padding: 20px; border-radius: 5px;">
        <h2 style="color: #333; text-align: center;">OTP Verification</h2>
        <p style="font-size: 16px;">Hello,</p>
        <p style="font-size: 16px;">Your One-Time Password (OTP) for verification is:</p>
        <div style="background-color: #fff; padding: 20px; text-align: center; border-radius: 5px; margin: 20px 0;">
            <h1 style="color: #007bff; font-size: 32px; letter-spacing: 5px; margin: 0;">{{ otp }}</h1>
        </div>
        <p style="font-size: 14px; color: #666;">This OTP is valid for a limited time. Please do not share this code with anyone.</p>
        <p style="font-size: 14px; color: #666;">If you did not request this OTP, please ignore this email.</p>
        <p style="font-size: 14px; margin-top: 30px;">Best regards,<br>ExpensePro Team</p>
    </div>
</body>
</html>
